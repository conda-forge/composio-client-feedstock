schema_version: 1

context:
  name: composio-client
  version: "2.1.32"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/composio_client-${{ version }}.tar.gz
  sha256: 1328a9c5d8440aeeb758b9d355a907e585e5ee8486963bc401402db7a8ee3e44

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling ==1.26.3
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.27
    - pydantic >=2.9,<3
    - typing_extensions >=4.12
tests:
  - python:
      imports:
        - composio_client
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: The official Python library for the composio API
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ComposioHQ/composio-base-py

extra:
  recipe-maintainers:
    - jan-janssen
